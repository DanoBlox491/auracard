<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AuraCard - Gamer Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg: #0f0f13; --panel: #1e1e24; --text: #fff; --muted: #a0a0a5; --accent: #00e5ff; --gold: #ffd700; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100vh; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .screen.active { display: flex; }

        .navbar { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: var(--panel); border-radius: 12px; box-sizing: border-box; margin-bottom: 20px; border: 1px solid #333; }
        .nav-title { font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 900; color: var(--accent); }
        .nav-user { display: flex; align-items: center; gap: 10px; }
        .nav-user img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--accent); }
        .logout-btn { background: transparent; border: 1px solid #ff5252; color: #ff5252; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .logout-btn:hover { background: #ff5252; color: white; }

        .login-box { background: var(--panel); padding: 40px; border-radius: 16px; text-align: center; border-top: 5px solid var(--accent); max-width: 400px; width: 100%; margin-top: 10vh; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .auth-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .auth-btn:hover { transform: scale(1.02); }
        .btn-google { background: white; color: #333; }
        .btn-github { background: #24292e; color: white; border: 1px solid #444; }
        .btn-ms { background: #0078d4; color: white; }
        .btn-discord { background: #5865F2; color: white; }

        .dashboard { width: 100%; max-width: 800px; }
        .platform-grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .platform-card { background: var(--panel); padding: 30px; border-radius: 16px; width: 200px; text-align: center; cursor: pointer; border: 2px solid #333; transition: 0.3s; }
        .platform-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .platform-icon { font-size: 50px; margin-bottom: 10px; }
        .platform-card h3 { margin: 0; font-family: 'Montserrat', sans-serif; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px; }
        .add-btn { background: var(--accent); color: #000; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; }
        .add-btn:hover { transform: scale(1.1); box-shadow: 0 0 20px rgba(0,229,255,0.5); }
        
        .leaderboard-list { width: 100%; background: var(--panel); border-radius: 12px; padding: 20px; box-sizing: border-box; }
        .player-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #333; }
        .player-row:last-child { border-bottom: none; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--panel); padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; border-top: 5px solid var(--accent); }
        .modal h2 { margin-top: 0; color: var(--accent); font-family: 'Montserrat', sans-serif; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--muted); }
        .form-group input { width: 100%; padding: 10px; background: #15151a; border: 1px solid #3a3a45; color: white; border-radius: 5px; box-sizing: border-box; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions button { flex: 1; padding: 12px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        .btn-cancel { background: #333; color: white; }
        .btn-submit { background: var(--accent); color: #000; }
        
        #canvas-preview { width: 100%; border-radius: 8px; margin: 15px 0; display: none; }
    </style>
</head>
<body>

    <audio id="funkPlayer" loop></audio>

    <!-- SCREEN 1: LOGIN -->
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h1 style="font-family: 'Montserrat'; font-weight: 900; color: var(--accent); font-size: 40px; margin-bottom: 10px;">AuraCard</h1>
            <p style="color: var(--muted); margin-bottom: 30px;">Sign in to access your cross-game profile.</p>
            
            <button class="auth-btn btn-google" id="googleLoginBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Sign in with Google
            </button>
            <button class="auth-btn btn-github" id="githubLoginBtn">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg> 
                Sign in with GitHub
            </button>
            <button class="auth-btn btn-ms" id="microsoftLoginBtn">
                Sign in with Microsoft / Xbox
            </button>
            <button class="auth-btn btn-discord" id="discordLoginBtn">
                Sign in with Discord
            </button>
        </div>
    </div>

    <!-- SCREEN 2: DASHBOARD -->
    <div id="dashboard-screen" class="screen">
        <div class="navbar">
            <div class="nav-title">AuraCard</div>
            <div class="nav-user">
                <img id="user-avatar" src="https://via.placeholder.com/35">
                <span id="user-name" style="font-weight: bold;">User</span>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>
        
        <div class="dashboard">
            <h2 style="text-align: center; font-family: 'Montserrat';">Select Your Platform</h2>
            <div class="platform-grid">
                <div class="platform-card" onclick="selectPlatform('minecraft')">
                    <div class="platform-icon">⛏️</div>
                    <h3>Minecraft Java</h3>
                </div>
                <div class="platform-card" onclick="selectPlatform('bedrock')">
                    <div class="platform-icon">🪨</div>
                    <h3>Minecraft Bedrock</h3>
                </div>
                <div class="platform-card" onclick="selectPlatform('roblox')">
                    <div class="platform-icon">🟥</div>
                    <h3>Roblox</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- SCREEN 3: LEADERBOARD -->
    <div id="platform-screen" class="screen">
        <div class="navbar">
            <div class="nav-title" id="platform-title">Platform</div>
            <div class="nav-user">
                <button class="logout-btn" onclick="goToDashboard()" style="border-color: #00e5ff; color: #00e5ff;">Back</button>
            </div>
        </div>
        
        <div class="platform-view" style="width: 100%; max-width: 800px;">
            <div class="top-bar">
                <h2 style="font-family: 'Montserrat'; margin: 0;" id="platform-leaderboard-title">Top Aura Farmers</h2>
                <button class="add-btn" id="openCreateModal">+</button>
            </div>
            <div class="leaderboard-list" id="leaderboard-content">
                <p style="text-align: center; color: var(--muted);">Loading...</p>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="create-modal">
        <div class="modal">
            <h2>Create AuraCard</h2>
            <div class="form-group">
                <label>Username (Premium Only)</label>
                <input type="text" id="input-username" placeholder="Enter username...">
            </div>
            <p id="validation-error" style="color: #ff5252; font-size: 12px; display: none;">Invalid or cracked username!</p>
            
            <div class="modal-actions" id="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-submit" id="validateBtn">Validate</button>
            </div>

            <div id="card-details" style="display: none; margin-top: 20px; border-top: 1px solid #444; padding-top: 20px;">
                <p style="color: var(--accent); font-size: 14px; margin-bottom: 15px; text-align: center;">✨ Aura Data Fetched Successfully!</p>
                <button class="btn-submit" style="width: 100%; padding: 15px;" onclick="generateCard()">Generate AuraCard!</button>
            </div>

            <canvas id="card-canvas" style="display: none;"></canvas>
            <img id="canvas-preview">
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYhHn7VEETiFPkMh9OtYO825-ejUQBNUg",
            authDomain: "auracard-7b97f.firebaseapp.com",
            projectId: "auracard-7b97f",
            storageBucket: "auracard-7b97f.firebasestorage.app",
            messagingSenderId: "266276728636",
            appId: "1:266276728636:web:2c36f2e588d6d8dcab3839",
            measurementId: "G-MZ0242QRC7"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentPlatform = "";
        let currentUser = null;
        let validatedUsername = "";
        window.realRobloxData = null; 

        const funkPlayer = document.getElementById('funkPlayer');
        const FUNK_LOW = 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3';
        const FUNK_MID = 'https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0c6ff1b19.mp3';
        const FUNK_HIGH = 'https://cdn.pixabay.com/download/audio/2022/10/25/audio_5c9c7c9b9c.mp3';

        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null); 
                img.src = url;
            });
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goToDashboard() {
            showScreen('dashboard-screen');
        }

        function selectPlatform(platform) {
            currentPlatform = platform;
            const titleMap = { 'minecraft': 'Minecraft Java', 'bedrock': 'Minecraft Bedrock', 'roblox': 'Roblox' };
            document.getElementById('platform-title').innerText = titleMap[platform];
            document.getElementById('platform-leaderboard-title').innerText = `Top ${titleMap[platform]} Aura Farmers`;
            showScreen('platform-screen');
            loadLeaderboard(platform);
        }

        async function loginWithProvider(providerName) {
            try {
                let provider;
                if (providerName === 'google') provider = new firebase.auth.GoogleAuthProvider();
                else if (providerName === 'github') provider = new firebase.auth.GithubAuthProvider();
                else if (providerName === 'microsoft') {
                    provider = new firebase.auth.OAuthProvider('microsoft.com');
                    provider.setCustomParameters({ prompt: 'select_account' });
                }
                else if (providerName === 'discord') provider = new firebase.auth.OAuthProvider('discord.com');

                const result = await auth.signInWithPopup(provider);
                currentUser = result.user;
                
                document.getElementById('user-name').innerText = currentUser.displayName || "Gamer";
                document.getElementById('user-avatar').src = currentUser.photoURL || "https://via.placeholder.com/35";
                showScreen('dashboard-screen');
            } catch (error) {
                alert(`Login failed (${providerName}): ` + error.message);
            }
        }

        document.getElementById('googleLoginBtn').addEventListener('click', () => loginWithProvider('google'));
        document.getElementById('githubLoginBtn').addEventListener('click', () => loginWithProvider('github'));
        document.getElementById('microsoftLoginBtn').addEventListener('click', () => loginWithProvider('microsoft'));
        document.getElementById('discordLoginBtn').addEventListener('click', () => loginWithProvider('discord'));

        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut();
            currentUser = null;
            showScreen('login-screen');
        });

        document.getElementById('openCreateModal').addEventListener('click', () => {
            document.getElementById('create-modal').classList.add('active');
            document.getElementById('card-details').style.display = 'none';
            document.getElementById('modal-actions').style.display = 'flex';
            document.getElementById('validation-error').style.display = 'none';
            document.getElementById('input-username').value = "";
            document.getElementById('canvas-preview').style.display = 'none';
            window.realRobloxData = null;
        });

        function closeModal() { document.getElementById('create-modal').classList.remove('active'); }

        document.getElementById('validateBtn').addEventListener('click', async () => {
            const username = document.getElementById('input-username').value.trim();
            if (!username) return alert("Please enter a username.");
            
            const btn = document.getElementById('validateBtn');
            const err = document.getElementById('validation-error');
            btn.innerText = "Fetching Real Data...";
            err.style.display = 'none';

            let isValid = false;

            try {
                if (currentPlatform === 'roblox') {
                    const res = await fetch('https://auracard-backend-kzgy.onrender.com/api/roblox_stats', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: username })
                    });
                    
                    const data = await res.json();
                    
                    if (data.success) {
                        isValid = true;
                        window.realRobloxData = data; 
                    } else {
                        err.innerText = data.error || "Roblox user not found.";
                        err.style.display = 'block';
                    }
                } 
                else if (currentPlatform === 'minecraft') {
                    const res = await fetch(`https://api.mojang.com/users/profiles/minecraft/${username}`);
                    if (res.status === 200) isValid = true;
                    else { err.innerText = "Invalid Minecraft Java username."; err.style.display = 'block'; }
                } 
                else if (currentPlatform === 'bedrock') {
                    const res = await fetch(`https://api.geysermc.org/v2/xbox/user/${username}`);
                    if (res.status === 200) isValid = true;
                    else { err.innerText = "Invalid Bedrock Gamertag."; err.style.display = 'block'; }
                }
            } catch (e) { 
                console.error(e); 
                err.innerText = "Cannot connect to AuraCard Backend. Is Python running?";
                err.style.display = 'block';
            }

            btn.innerText = "Validate";
            
            if (isValid) {
                validatedUsername = username;
                document.getElementById('card-details').style.display = 'block';
                document.getElementById('modal-actions').style.display = 'none';
            }
        });

        async function generateCard() {
            let stat1, stat2, stat3, bio, title, titleColor;
            let label1 = "ACCOUNT AGE", label2 = "AURA SCORE", label3 = "FOLLOWERS";
            let color1 = "#fff", color2 = "#00e5ff", color3 = "#ff6464";

            if (currentPlatform === 'roblox' && window.realRobloxData) {
                const d = window.realRobloxData;
                
                stat1 = d.games_played;
                stat2 = d.games_won;
                stat3 = d.friends + " Friends";
                
                bio = d.description || "No bio set.";
                title = d.title;
                titleColor = d.years_old >= 8 ? '#ffd700' : '#00e5ff';
                
                label1 = "GAMES PLAYED";
                label2 = "GAMES WON";
                label3 = "FRIENDS";

                if (d.aura_score >= 5000) { funkPlayer.src = FUNK_HIGH; } 
                else if (d.aura_score >= 2000) { funkPlayer.src = FUNK_MID; } 
                else { funkPlayer.src = FUNK_LOW; }
            } 
            else {
                let hash = 0;
                for (let i = 0; i < validatedUsername.length; i++) {
                    hash = validatedUsername.charCodeAt(i) + ((hash << 5) - hash);
                }
                
                stat1 = Math.abs(hash % 2350) + 150; 
                stat2 = stat1 + Math.abs(hash % 800) + 50;
                stat3 = `${Math.abs(hash % 45) + 5}x Win Streak`;
                bio = `The Ultimate ${currentPlatform.toUpperCase()} Legend.`;
                
                title = `${currentPlatform.charAt(0).toUpperCase() + currentPlatform.slice(1)} Player`;
                titleColor = '#969696';
                if (stat1 > 1500) { title = `${currentPlatform} Legend`; titleColor = '#ffd700'; }
                else if (stat1 > 800) { title = `${currentPlatform} Pro`; titleColor = '#ff6464'; }
                
                label1 = "GAMES PLAYED";
                label2 = "GAMES WON";
                label3 = "AURA STREAK";

                funkPlayer.src = FUNK_MID; 
            }

            funkPlayer.volume = 0.5;
            funkPlayer.play().catch(e => console.log("Audio blocked: ", e));

            const canvas = document.getElementById('card-canvas');
            canvas.width = 900;
            canvas.height = 600;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0f0f13';
            ctx.fillRect(0, 0, 900, 600);
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, 880, 580);

            ctx.fillStyle = '#00e5ff';
            ctx.font = 'bold 50px "Montserrat", sans-serif';
            ctx.fillText("AURACARD", 50, 80);
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 30px "Montserrat", sans-serif';
            ctx.fillText(validatedUsername, 50, 130);
            
            ctx.fillStyle = titleColor;
            ctx.font = 'bold 20px "Roboto", sans-serif';
            ctx.fillText(title.toUpperCase(), 50, 160);

            // --- FULL BODY AVATAR & AURA EFFECT ---
            if (currentPlatform === 'roblox' && window.realRobloxData && window.realRobloxData.avatar_url) {
                const avatarImg = await loadImage(window.realRobloxData.avatar_url);
                if (avatarImg) {
                    const centerX = 740; 
                    const centerY = 280;
                    
                    // 1. Draw Aura Glow (Radial Gradient)
                    const gradient = ctx.createRadialGradient(centerX, centerY, 20, centerX, centerY, 200);
                    gradient.addColorStop(0, 'rgba(0, 229, 255, 0.3)');
                    gradient.addColorStop(1, 'rgba(0, 229, 255, 0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(centerX - 200, centerY - 200, 400, 400);

                    // 2. Draw Glowing Rings (Aura Pose vibes)
                    ctx.strokeStyle = 'rgba(0, 229, 255, 0.7)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.ellipse(centerX, centerY + 120, 100, 25, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
                    ctx.beginPath();
                    ctx.ellipse(centerX, centerY + 120, 130, 35, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // 3. Draw the Full Body Avatar
                    const avatarSize = 320;
                    ctx.drawImage(avatarImg, centerX - (avatarSize/2), centerY - (avatarSize/2) - 20, avatarSize, avatarSize);
                }
            }

            // Stats Box
            ctx.fillStyle = '#191920';
            ctx.fillRect(50, 400, 800, 150);
            ctx.strokeStyle = '#32323c';
            ctx.strokeRect(50, 400, 800, 150);

            ctx.fillStyle = '#969696';
            ctx.font = '14px "Roboto", sans-serif';
            ctx.fillText(label1, 80, 430);
            ctx.fillStyle = color1;
            ctx.font = 'bold 28px "Montserrat", sans-serif';
            ctx.fillText(stat1, 80, 460);

            ctx.fillStyle = '#969696';
            ctx.font = '14px "Roboto", sans-serif';
            ctx.fillText(label2, 300, 430);
            ctx.fillStyle = color2;
            ctx.font = 'bold 28px "Montserrat", sans-serif';
            ctx.fillText(stat2, 300, 460);

            ctx.fillStyle = '#969696';
            ctx.font = '14px "Roboto", sans-serif';
            ctx.fillText(label3, 520, 430);
            ctx.fillStyle = color3;
            ctx.font = 'bold 28px "Montserrat", sans-serif';
            ctx.fillText(stat3, 520, 460);

            // Bio (Restricted width to avoid avatar overlap)
            ctx.fillStyle = '#a0a0a5';
            ctx.font = '16px "Roboto", sans-serif';
            let words = bio.split(' ');
            let line = '';
            let y = 220;
            for(let n = 0; n < words.length; n++) {
              let testLine = line + words[n] + ' ';
              let metrics = ctx.measureText(testLine);
              if (metrics.width > 450 && n > 0) { 
                ctx.fillText(line, 50, y);
                line = words[n] + ' ';
                y += 24;
              } else {
                line = testLine;
              }
            }
            ctx.fillText(line, 50, y);

            const preview = document.getElementById('canvas-preview');
            preview.src = canvas.toDataURL('image/png');
            preview.style.display = 'block';
            document.getElementById('card-details').style.display = 'none';

            if (db && currentUser) {
                try {
                    await db.collection('auracards').add({
                        user: currentUser.uid,
                        platform: currentPlatform,
                        username: validatedUsername,
                        wins: parseInt(stat1) || 0,
                        bio: bio,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch(e) { console.log("DB Error: ", e); }
            }
            
            setTimeout(() => {
                closeModal();
                loadLeaderboard(currentPlatform);
            }, 3000);
        }

        function loadLeaderboard(platform) {
            const list = document.getElementById('leaderboard-content');
            list.innerHTML = `<p style="text-align: center; color: var(--muted);">Loading top players...</p>`;
            
            if (!db) return;

            db.collection('auracards')
              .where('platform', '==', platform)
              .orderBy('wins', 'desc')
              .limit(10)
              .get()
              .then((querySnapshot) => {
                  list.innerHTML = "";
                  if (querySnapshot.empty) {
                      list.innerHTML = `<p style="text-align: center; color: var(--muted);">No cards yet. Be the first!</p>`;
                      return;
                  }
                  let rank = 1;
                  querySnapshot.forEach((doc) => {
                      const data = doc.data();
                      const color = rank === 1 ? 'var(--gold)' : rank === 2 ? '#c0c0c0' : rank === 3 ? '#cd7f32' : '#fff';
                      list.innerHTML += `
                          <div class="player-row">
                              <span>#${rank} ${data.username}</span> 
                              <span style="color: ${color};">${data.wins} Aura</span>
                          </div>
                      `;
                      rank++;
                  });
              }).catch((error) => {
                  console.log("Leaderboard error: ", error);
                  list.innerHTML = `<p style="text-align: center; color: var(--muted);">Create a database index in Firebase to load leaderboard.</p>`;
              });
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-name').innerText = user.displayName || "Gamer";
                document.getElementById('user-avatar').src = user.photoURL || "https://via.placeholder.com/35";
                showScreen('dashboard-screen');
            } else {
                showScreen('login-screen');
            }
        });
    </script>
</body>
</html>
