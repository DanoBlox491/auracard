// 🎨 RENDERING PIPELINE FOR PLAYER CARD INFRASTRUCTURE
function updateCardPreview() {
const username = document.getElementById('input-username').value || "Gamer Handle";
const game = document.getElementById('input-game').value;
const statVal = document.getElementById('input-stat').value || "0";
// Draw Gradient Background
let gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
if(activePlatform === 'roblox') {
gradient.addColorStop(0, '#1e1e24'); gradient.addColorStop(1, '#00e5ff');
} else if(activePlatform === 'youtube') {
gradient.addColorStop(0, '#1e1e24'); gradient.addColorStop(1, '#ff0000');
} else {
gradient.addColorStop(0, '#1e1e24'); gradient.addColorStop(1, '#4CAF50');
}
ctx.fillStyle = gradient;
ctx.fillRect(0, 0, canvas.width, canvas.height);
// Draw Framing Lines
ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
ctx.lineWidth = 2;
ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
// Render Text Layouts
ctx.fillStyle = '#fff';
ctx.font = "900 36px 'Montserrat'";
ctx.fillText(username, 50, 80);
ctx.fillStyle = 'rgba(255,255,255,0.6)';
ctx.font = "500 16px 'Roboto'";
ctx.fillText("NETWORK IDENTITY CARD", 50, 40);
ctx.fillStyle = '#00e5ff';
ctx.font = "900 20px 'Montserrat'";
if(activePlatform === 'roblox') {
ctx.fillText(FEATURED GAME: ${game.toUpperCase()}, 50, 130);
ctx.fillStyle = '#fff';
ctx.fillText(VICTORIES: ${statVal}, 50, 170);
} else if(activePlatform === 'youtube') {
ctx.fillText(CHANNEL PROFILE, 50, 130);
ctx.fillStyle = '#fff';
ctx.fillText(SUBSCRIBERS: ${statVal}, 50, 170);
} else {
ctx.fillText(BLOCK WORLD DATA, 50, 130);
ctx.fillStyle = '#fff';
ctx.fillText(DIAMONDS: ${statVal}, 50, 170);
}
}
async function submitAuraCard() {
const username = document.getElementById('input-username').value;
const statVal = parseInt(document.getElementById('input-stat').value) || 0;
const game = document.getElementById('input-game').value;
if(!username) {
alert("Please enter a valid username/handle first.");
return;
}
// Calculate Gamer Aura Score mathematically based on verification input
let finalScore = statVal * 12;
try {
await db.collection("leaderboard").add({
username: username,
platform: activePlatform,
game: activePlatform === 'roblox' ? game : activePlatform,
score: finalScore,
timestamp: firebase.firestore.FieldValue.serverTimestamp()
});
alert("Stats verified! AuraCard pushed to global ranking pipeline.");
switchScreen('leaderboard');
} catch(error) {
console.error("Database save exception: ", error);
alert("Write request rejected. Check connection rules.");
}
}
async function loadLeaderboardData() {
const container = document.getElementById('leaderboard-container');
container.innerHTML = <div style="text-align: center; color: var(--muted);  padding: 20px;">Reading production indexes...</div>;
try {
const snapshot = await db.collection("leaderboard")
.orderBy("score", "desc")
.limit(20).get();
container.innerHTML = '';
if(snapshot.empty) {
container.innerHTML = <div style="text-align: center; color: var(--muted);  padding: 20px;">No ranked gamers found yet.</div>;
return;
}
let rank = 1;
snapshot.forEach(doc => {
const data = doc.data();
const item = document.createElement('div');
item.className = leaderboard-item rank-${rank <= 3 ? rank : 'regular'};
item.innerHTML = <div class="rank-info"> <div class="rank-num">${rank}</div>  <span class="player-name">${data.username}</span> <span class="player-game">${data.game}</span> </div> </div> <div class="score-display"> <div class="score-val">${data.score}</div> <div class="score-lbl">Gamer Aura</div> </div>;
container.appendChild(item);
rank++;
});
} catch(error) {
console.error("Leaderboard fetch error: ", error);
container.innerHTML = <div style="text-align: center; color: var(--purple);  padding: 20px;">Failed to read ranking indexes.</div>;
}
}
